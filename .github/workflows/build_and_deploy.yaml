# Build and push the image. That is all.
#
# Deployment is NOT done here. argocd-image-updater runs in the cluster,
# watches GHCR, and commits the new digest to the homelab repo using a
# Vault-backed PAT scoped to that one repo. So this workflow needs no
# homelab credential: GITHUB_TOKEN is issued per-run by Actions and can
# only push packages.
#
# The older approach cloned the homelab repo from here and pushed rendered
# manifests, which required a long-lived CI_PAT with write access to the
# infra repo, stored in every service repo. This avoids that entirely.
name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -race ./...

      # Catches the deploy failures that are otherwise silent: a missing
      # kustomization means image-updater skips the app forever while it
      # sits Synced/Healthy on a stale image.
      - name: Check deploy manifests
        run: ./scripts/check-deploy.sh

      - name: Build
        run: CGO_ENABLED=0 go build -o bin/app .

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # Full SHA, not short. An abbreviated tag does not exist in the
          # registry and yields ImagePullBackOff.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
